body::before{content:"";position:fixed;inset:0;background:linear-gradient(rgba(22,12,40,.35),rgba(22,12,40,.6));z-index:-1}
main{position:relative;z-index:1;max-width:720px;margin:0 auto;padding:12px 14px 90px;text-align:center}
header{display:flex;align-items:center;justify-content:center;gap:10px}
h1{font:400 clamp(32px,8vw,50px)/1.05 "Ruslan Display",Georgia,serif;margin:0;color:var(--pump);text-shadow:0 0 14px rgba(255,138,31,.7),0 2px 0 #3a1500}
h2{font:400 28px "Ruslan Display",Georgia,serif;color:var(--pump);margin:4px 0 8px}
.sub{font-size:16px;color:var(--moon)}
.pkw{width:64px;flex:none}.pk{width:100%;filter:drop-shadow(0 0 12px rgba(255,138,31,.75))}
.pk .e{fill:#ffe27a;filter:drop-shadow(0 0 5px #ffd54a);animation:fk 2.6s ease-in-out infinite}
@keyframes fk{0%,100%{opacity:1}40%{opacity:.5}55%{opacity:.95}}
.card{background:var(--card);border:1px solid rgba(255,138,31,.55);border-radius:18px;padding:14px;margin-top:12px;box-shadow:0 6px 26px rgba(0,0,0,.5)}
.hr{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:6px}
.dots i{font-style:normal;font-size:19px;filter:grayscale(1);opacity:.35;margin-left:1px}
.dots .dn{filter:none;opacity:1}.dots .cur{filter:none;opacity:1;animation:pu 1.2s ease-in-out infinite}
@keyframes pu{50%{transform:scale(1.35);filter:drop-shadow(0 0 6px #ff8a1f)}}
.hs{display:flex;align-items:baseline;justify-content:center;gap:6px;flex-wrap:wrap;margin-top:4px}
.hs b{font:400 44px "Ruslan Display",serif;color:var(--moon);text-shadow:0 0 12px rgba(247,230,166,.6)}
.lrn{font-size:15px;opacity:.85;flex-basis:100%}
.bar{position:relative;height:12px;background:rgba(255,255,255,.15);border-radius:9px;margin:8px 4px 24px}
.bar>i{position:absolute;left:0;top:0;bottom:0;border-radius:9px;background:linear-gradient(90deg,#8a2be2,#ff8a1f,#ffe27a);transition:width .6s}
.bar s{position:absolute;top:-3px;width:2px;height:18px;background:var(--moon);text-decoration:none}
.bar em{position:absolute;top:19px;left:50%;transform:translateX(-50%);font-size:13px;font-style:normal;color:var(--moon)}
.hint{font-size:16px;opacity:.9;margin:4px 0}
.pile{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;min-height:64px;padding:10px;border:2px dashed rgba(247,230,166,.5);border-radius:14px;margin:8px 0}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.col{border-radius:14px;padding:8px;min-height:150px;border:2px solid}
.col h3{margin:0 0 6px;font-size:19px}
.col.ok{border-color:var(--ok);background:rgba(155,227,122,.1)}.col.ok h3{color:var(--ok)}
.col.no{border-color:var(--bad);background:rgba(255,143,176,.1)}.col.no h3{color:var(--bad)}
.zl{display:flex;flex-direction:column;gap:6px;align-items:stretch;min-height:90px}

function intro(){fresh();const c=load();hud();app.innerHTML=`<div class="card"><p>Ночью слова бродят как привидения, и ударения у них разбежались. Лови их!</p><p class="hint">В раунде ${N} слов. Перетащи каждое в колонку «Верно» или «Неверно» (на телефоне можно коснуться слова, а потом колонки). За каждое правильное решение ${PTS} очков. Всего ${ROUNDS} раундов, максимум ${GOAL} очков. Слова с ошибками обязательно вернутся в следующем раунде, а верно разложенные больше не повторяются.</p><button class="btn" id="go">Начать игру</button>${c?`<button class="btn ghost" id="co">Продолжить с раунда ${S.d+1}</button>`:""}</div>`;
$("go").onclick=()=>{fresh();clr();startRound()};if(c)$("co").onclick=startRound}
function startRound(){S.r=S.d+1;sel=null;locked=false;const rt=sh([...S.retry]).slice(0,N),pool=sh(W.map((_,i)=>i).filter(i=>!S.retired.has(i)&&!S.retry.has(i)));
let ids=rt.concat(pool.slice(0,N-rt.length));if(ids.length<N)ids=ids.concat(sh([...S.retired]).slice(0,N-ids.length));
S.cards=sh(ids).map((i,k)=>{const wr=Math.random()<.5;return{i,k,wr,t:wr?W[i][1]:W[i][0]}});hud();play()}
function play(){app.innerHTML=`<section class="card" id="play"><p class="hint">Раунд ${S.r}: разложи слова по колонкам</p><div class="pile" data-z="pile">${S.cards.map(c=>`<div class="cd" data-k="${c.k}">${c.t}</div>`).join("")}</div>
<div class="cols"><div class="col ok" data-z="ok"><h3>✓ Верно</h3><div class="zl"></div></div><div class="col no" data-z="no"><h3>✗ Неверно</h3><div class="zl"></div></div></div><button class="btn" id="fin" disabled>Завершить раунд</button></section>`;
const pl=$("play");let d=null;
const zoneAt=(x,y,c)=>{for(const e of document.elementsFromPoint(x,y)){if(e===c||c.contains(e))continue;const z=e.closest("[data-z]");if(z&&!c.contains(z))return z}};
const put=(c,z)=>{(z.querySelector(".zl")||z).appendChild(c);c.classList.remove("sel","land");void c.offsetWidth;c.classList.add("land");sel=null;upd()};
const upd=()=>{$("fin").disabled=!!document.querySelector(".pile .cd")};
const hv=z=>document.querySelectorAll("[data-z]").forEach(e=>e.classList.toggle("hv",e===z));
pl.addEventListener("pointerdown",e=>{const c=e.target.closest(".cd");if(!c||locked)return;e.preventDefault();const r=c.getBoundingClientRect();d={c,x:e.clientX,y:e.clientY,ox:e.clientX-r.left,oy:e.clientY-r.top,w:r.width,mv:0};c.setPointerCapture(e.pointerId)});
pl.addEventListener("pointermove",e=>{if(!d)return;if(!d.mv){if(Math.hypot(e.clientX-d.x,e.clientY-d.y)<6)return;d.mv=1;d.c.classList.add("drag");d.c.style.width=d.w+"px"}d.c.style.left=e.clientX-d.ox+"px";d.c.style.top=e.clientY-d.oy+"px";hv(zoneAt(e.clientX,e.clientY,d.c))});
pl.addEventListener("pointerup",e=>{if(!d)return;const c=d.c;c.classList.remove("drag");c.style.cssText="";hv(null);
if(d.mv){const z=zoneAt(e.clientX,e.clientY,c);if(z)put(c,z)}else{const was=c.classList.contains("sel");document.querySelectorAll(".cd.sel").forEach(x=>x.classList.remove("sel"));if(!was){c.classList.add("sel");sel=c}else sel=null}d=null});
pl.addEventListener("click",e=>{const z=e.target.closest("[data-z]");if(sel&&z&&!e.target.closest(".cd"))put(sel,z)});
$("fin").onclick=fin}
function fin(){locked=true;let ok=0;const bad=[];S.cards.forEach(c=>{const z=document.querySelector(`.cd[data-k="${c.k}"]`).closest("[data-z]").dataset.z;
if((z=="ok")==!c.wr){ok++;S.retired.add(c.i);S.retry.delete(c.i)}else{S.retry.add(c.i);bad.push(c)}});
S.score+=ok*PTS;S.d=S.r;save();hud();
app.innerHTML=`<section class="card"><h2>Раунд ${S.r} завершён</h2><p class="big">Верно: ${ok} из ${N} <span class="pl">+${ok*PTS}</span></p>${bad.length?`<p class="hint">Над этими словами стоит поработать. Они вернутся в следующем раунде.</p><div class="er">${bad.map(c=>c.wr?`<div><span class="x">${hl(c.t)}</span> → <b class="g">${hl(W[c.i][0])}</b></div>`:`<div><b class="g">${hl(c.t)}</b> — это верное ударение</div>`).join("")}</div>`:`<p class="verdict">Без ошибок!</p>`}<button class="btn" id="nx">${S.r==ROUNDS?"К итогам":"Следующий раунд"}</button></section>`;
$("nx").onclick=S.r==ROUNDS?final:startRound}
function final(){clr();const s=S.score,m=s>=5000?"Превосходно! Можно сказать, что ударения ты знаешь на 5+!":s>=3000?"Ты молодец! Нужно пройти игру ещё несколько раз.":"Ты старался, но нужно попытаться ещё раз, чтобы все ударения тебе покорились!";
const left=[...S.retry];hud();
app.innerHTML=`<section class="card"><h2>Ночь закончилась</h2><p class="big">${s} из ${GOAL} очков</p>${s>=GOAL?'<p class="verdict">Победа! Ударения выучены!</p>':""}<p class="verdict">${m}</p><p class="hint">Выучено слов: ${S.retired.size} из ${W.length}</p>${left.length?`<p class="hint">Слова, которые ещё не покорились:</p><div class="er">${left.map(i=>`<div><b class="g">${hl(W[i][0])}</b></div>`).join("")}</div>`:""}<button class="btn" id="ag">Сыграть ещё раз</button></section>`;$("ag").onclick=intro}
let T=0;function thr(){const q=$("q").value.trim().toLowerCase(),cats=[...new Set(W.map(w=>w[2]))];
$("tl").innerHTML=cats.map(c=>{const a=W.filter(w=>w[2]==c&&(!q||(w[0]+" "+w[1]).toLowerCase().includes(q)));return a.length?`<h3>${c}</h3>`+a.map(w=>`<div>${hl(w[0])} <small class="x">${hl(w[1])}</small></div>`).join(""):""}).join("")||"<p>Ничего не найдено.</p>"}
$("fab").onclick=()=>{$("th").hidden=false;thr()};$("thx").onclick=()=>$("th").hidden=true;$("q").oninput=thr;
document.addEventListener("keydown",e=>{if(e.key=="Escape")$("th").hidden=true});
$("p1").innerHTML=PK;$("p2").innerHTML=PK;fx();intro();
</script></body></html>
